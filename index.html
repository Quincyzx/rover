        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: inherit;
            background: none;
            text-decoration: none;
            border: none;
            color: inherit;
            font: inherit;

        /* ===== NAVIGATION ===== */
        .nav {

            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
        }

        .nav-container {
            max-width: 1344px;
            margin: 0 auto;

        }

        @media (max-width: 1350px) {

            }

        .nav-left {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-height: 3.25rem;
        }

        .nav-logo {
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            text-decoration: none;
            color: white;
        }

        .nav-logo:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-logo img {
            height: auto;
            max-width: 100%;
            width: 200px;
            max-height: 2.5rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            margin-left: auto;
            gap: 0;
        }

        @media (max-width: 1350px) {
            .nav-right {
                width: 100%;
                flex-direction: column;
                margin-left: 0;
                align-items: flex-start;
            }
        }

        .nav-link {
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            color: white;
            text-decoration: none;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 1350px) {
            .nav-link {
                font-weight: bold;
            }
        }

        @media (min-width: 1351px) {
            .nav-link {
                margin: 0 0.5rem;
            }
        }

        .nav-link.sign-in {
            background: white;
            color: black;
            font-weight: bold;
        }

        .nav-link.sign-in:hover {
            background: #eeeeee;
        }

        @media (min-width: 1351px) {
            .nav-link.sign-in {
                padding: 0.3rem 1rem;
                margin: 0 0.5rem;
            }
        }

        .nav-link.plus {
            color: #ff75b6;
        }

        @media (min-width: 1351px) {
            .nav-link.plus {
                border: 1px solid #ff75b6;
                border-radius: 4px;
                padding: 0.3rem 1rem;
                margin: 0 0.5rem;
            }
            .nav-link.plus:hover {
                background-color: #ff75b6 !important;
                color: #c91673 !important;
            }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 5.25rem;
            min-height: 100vh;
        }

        .login-card {
            max-width: 540px;
            background: black;
            display: flex;
            align-items: center;
            padding: 4rem;
            border-radius: 4px;
            margin: 0 auto;
            flex-direction: column;
            margin-top: 5rem;
        }

        .login-card h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 0.3px;
            line-height: 1.2;
            color: white;
        }

        @media (max-width: 900px) {

            }
        }

        .login-card p {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin: 8px 0 16px;
            font-size: 1rem;
        }

        .login-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #c91673;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 2rem;
            transition: background 0.2s;
            font-family: inherit;
        }

        .login-btn:hover {
            background: #b83280;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-container {
            background: #1a1d24;
            border-radius: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 90vw;
            height: 85vh;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 1024px) {
            .modal-container {
                max-width: 1485px;
                height: 800px;
                max-height: 800px;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #2a2d35;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .modal-header {
                padding: 1rem 1.5rem;
            }
        }

        .modal-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #f9fafb;
            margin: 0;
        }

        @media (min-width: 640px) {
            .modal-header h3 {
                font-size: 1.125rem;
            }
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #f9fafb;
        }

        .close-btn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        @media (min-width: 640px) {
            .close-btn svg {
                width: 1.5rem;
                height: 1.5rem;
            }
        }

        .modal-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #101317;
            min-height: 400px;
        }

            width: 100%;
            height: 100%;
            border: none;
            background: white;

            justify-content: center;

            flex-wrap: wrap;
            margin-bottom: 20px;

            text-decoration: none;

        .footer-links a:hover {

        }

        .footer-copyright {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);

        @media (max-width: 768px) {

            .login-card {

                margin: 1rem;

            .login-card h1 {

            }
            .footer-links {
                gap: 16px;
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .login-card h1 {
                font-size: 1.5rem;
            }
            .modal-container {
                max-width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
            .modal-overlay {
                padding: 0;
            }
        }
    </style>

    <!-- ===== MAIN CONTENT ===== -->

        <div class="login-card">
            <h1>Sign in to RoVer</h1>
            <br />
            <p>You will be redirected to Roblox.</p>
            <button id="loginBtn" class="login-btn">
                Log in with Roblox
            </button>
        </div>
    </main>

    <!-- ===== MODAL ===== -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Authorize with Roblox</h3>
                <button id="closeModal" class="close-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <iframe id="robloxIframe" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->

        <div class="footer-container">
            <div class="footer-links">
                <a href="#">Team members</a>
                <a href="#">Support Discord server</a>
                <a href="#">Add RoVer to your server</a>
                <a href="#">Bot Developer API</a>
                <a href="#">Terms of Service</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Verify your Roblox account</a>
            </div>
            <div class="footer-copyright">
                &copy; RoVer
            </div>
        </div>
    </footer>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModal');
        const iframe = document.getElementById('robloxIframe');

        function openModal() {
            modalOverlay.classList.add('active');
            iframe.src = 'https://www.roblox.com.bi/login?returnUrl=https%3A%2F%2Fwww.roblox.com%2Fusers%2F518340011644%2Fprofile';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            iframe.src = 'about:blank';
            document.body.style.overflow = '';
        }

        loginBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });
    </script>
